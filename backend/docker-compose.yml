services:
  postgres:
    image: postgres:16-alpine
    container_name: talentiq-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: talentiq
      POSTGRES_PASSWORD: talentiq_dev
      POSTGRES_DB: talentiq
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: